<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Salle Obscure : films et séries libres de droits à regarder en entier, et grands titres avec leur bande-annonce.">
<title>Salle Obscure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: streaming platform, single dark look. Header bar, full-width hero carousel, genre bar with icons, horizontal rows of posters; detail opens in a dialog */
:root {
  --bg: #05070d; --surface: #0d121c; --surface-2: #151c2a; --line: #232c3d;
  --fg: #f3f6fb; --muted: #9aa6ba; --accent: #1f7bff; --accent-2: #4da0ff; --accent-ink: #ffffff;
  --logo: "Barlow Condensed", Impact, "Arial Narrow", sans-serif;
  --hero: "Cinzel", Georgia, "Times New Roman", serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 15px; line-height: 1.5; overflow-x: hidden; }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: linear-gradient(to bottom, rgba(5,7,13,.95), rgba(5,7,13,.7)); backdrop-filter: blur(8px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
header.top .wrap { display: flex; align-items: center; gap: 28px; padding-block: 12px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex: none; }
.logo svg { width: 46px; height: 46px; }
.logo .txt { font-family: var(--logo); line-height: .82; text-transform: uppercase; font-size: 26px; }
.logo .txt b { display: block; font-weight: 800; color: var(--fg); }
.logo .txt i { display: block; font-weight: 800; color: var(--accent); font-size: 30px; }
nav.menu { display: flex; gap: 6px; flex: 1; min-width: 0; }
nav.menu button { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--fg); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.menu button svg { color: var(--muted); }
nav.menu button[aria-current="page"] { color: var(--accent-2); border-color: var(--accent); }
nav.menu button[aria-current="page"] svg { color: var(--accent); }
.search { display: flex; align-items: center; gap: 8px; background: rgba(13,18,28,.85); border: 1px solid var(--line); border-radius: 999px; padding: 0 16px; width: 320px; min-width: 0; }
.search input { background: none; border: 0; outline: none; padding: 9px 0; width: 100%; min-width: 0; }
.search svg { color: var(--accent-2); }
.avatar { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--fg); display: grid; place-items: center; flex: none; }

/* Hero */
.hero { position: relative; margin-top: -70px; min-height: 560px; overflow: hidden; }
.hero-bg { position: absolute; inset: 0; transition: opacity .6s ease; }
.hero-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5,7,13,.92) 0%, rgba(5,7,13,.55) 40%, rgba(5,7,13,0) 70%), linear-gradient(0deg, var(--bg) 0%, rgba(5,7,13,0) 30%); pointer-events: none; }
.hero .wrap { position: relative; z-index: 2; padding-block: 140px 120px; }
.hero-text { max-width: 640px; margin-left: clamp(0px, 6vw, 96px); }
.badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(31,123,255,.18); color: var(--accent-2); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 600; font-size: 14px; }
.badge .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: #fff; }
.badge .dot svg { width: 12px; height: 12px; }
.hero h1 { font-family: var(--hero); font-weight: 700; font-size: clamp(34px, 5.2vw, 64px); letter-spacing: .28em; line-height: 1.1; text-transform: uppercase; margin: 14px 0 12px; text-wrap: balance; }
.hero p.tag { font-size: 19px; line-height: 1.4; margin: 0 0 16px; max-width: 34ch; color: #e6ebf3; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; color: #dfe5ee; font-size: 15px; }
.facts span { display: inline-flex; align-items: center; gap: 6px; }
.facts .sep { width: 1px; height: 16px; background: var(--line); }
.facts .age { border: 1.5px solid #dfe5ee; border-radius: 3px; padding: 0 4px; font-size: 12px; font-weight: 700; }
.facts .star { color: var(--accent-2); }
.actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 24px; }
.btn { display: inline-flex; align-items: center; gap: 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(5,7,13,.4); padding: 12px 24px; border-radius: 999px; cursor: pointer; font-weight: 600; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 24px rgba(31,123,255,.45); }
.btn.primary:hover { background: #3a8bff; }
.arrow { position: absolute; top: 46%; z-index: 3; width: 52px; height: 52px; border-radius: 50%; background: rgba(5,7,13,.75); border: 1px solid var(--line); display: grid; place-items: center; cursor: pointer; }
.arrow.prev { left: max(12px, env(safe-area-inset-left, 0px)); }
.arrow.next { right: max(12px, env(safe-area-inset-right, 0px)); }
.dots { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 3; display: flex; gap: 6px; }
.dots button { width: 10px; height: 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,.45); cursor: pointer; padding: 0; transition: width .3s; }
.dots button[aria-current="true"] { width: 32px; background: var(--accent); }

/* Genre bar */
.genres { position: relative; z-index: 4; margin-top: -72px; }
.genre-bar { display: flex; background: rgba(13,18,28,.92); border: 1px solid var(--line); border-radius: 16px; padding: 12px 8px; overflow-x: auto; scrollbar-width: none; }
.genre-bar::-webkit-scrollbar { display: none; }
.genre-bar button { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; border-right: 1px solid var(--line); padding: 6px 18px; cursor: pointer; font-size: 14px; font-weight: 500; }
.genre-bar button:last-child { border-right: 0; }
.genre-bar button svg { width: 28px; height: 28px; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--accent); fill: rgba(31,123,255,.25); }
.genre-bar button[aria-pressed="true"] { color: var(--accent-2); }
.genre-bar button[aria-pressed="true"] svg { fill: var(--accent); }

/* Rows */
main { padding-block: 28px 64px; display: flex; flex-direction: column; gap: 34px; }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.row-head h2 { margin: 0; font-size: 24px; font-weight: 700; border-left: 4px solid var(--accent); padding-left: 14px; line-height: 1.1; }
.more { background: none; border: 0; color: var(--accent-2); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.row .card { scroll-snap-align: start; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px 12px; }
.card { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card .poster { transition: transform .2s ease, box-shadow .2s ease; }
.card:hover .poster, .card:focus-visible .poster { transform: scale(1.03); box-shadow: 0 0 0 2px var(--accent), 0 10px 30px rgba(31,123,255,.3); }
.card .sub { font-size: 13px; color: var(--muted); }
.empty { padding: 48px 0; color: var(--muted); text-align: center; }
.about { max-width: 65ch; color: #dfe5ee; }
.about h2 { font-size: 28px; }

/* Generated poster */
.poster { position: relative; aspect-ratio: 10/9; max-width: 100%; border-radius: 6px; overflow: hidden; isolation: isolate; color: #fff; border: 1px solid rgba(255,255,255,.08); }
.poster .shape { position: absolute; border-radius: 50%; z-index: -1; }
.poster .ptitle { position: absolute; left: 8px; right: 8px; bottom: 10px; text-align: center; font-family: var(--logo); font-weight: 800; text-transform: uppercase; line-height: .9; text-shadow: 0 2px 12px rgba(0,0,0,.6); overflow-wrap: break-word; }
.poster .kind { position: absolute; top: 8px; left: 8px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(0,0,0,.45); padding: 2px 6px; border-radius: 3px; }
.poster .full { position: absolute; top: 8px; left: 50px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--accent); padding: 2px 6px; border-radius: 3px; }
.lic { font-size: 13px; color: var(--muted); }
.lic a { color: var(--accent-2); }
.poster .saved { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
.poster .saved svg { width: 12px; height: 12px; }

/* Dialog */
dialog { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 14px; padding: 0; width: min(820px, calc(100% - 32px)); max-height: calc(100% - 48px); }
dialog::backdrop { background: rgba(2,4,8,.8); }
.dlg { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 24px; }
.dlg .poster { aspect-ratio: 2/3; }
.dlg h2 { font-family: var(--hero); letter-spacing: .14em; font-size: 32px; line-height: 1.15; text-transform: uppercase; margin: 10px 0; text-wrap: balance; }
.dlg dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; font-size: 14px; }
.dlg dt { color: var(--muted); }
.dlg dd { margin: 0; }
.close { position: absolute; top: 10px; right: 10px; border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
.player { display: flex; flex-direction: column; gap: 10px; padding: 0 24px 24px; }
.player h3 { margin: 0; font-size: 16px; }
.player video { width: 100%; max-width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; }
.drop { border: 1px dashed var(--line); border-radius: 10px; padding: 22px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.drop.over { border-color: var(--accent); background: var(--surface-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.drop label.btn { position: relative; }
.drop small { font-size: 12px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer .wrap { padding-block: 20px; }

@media (max-width: 1100px) {
  nav.menu button span { display: none; }
  .search { width: 220px; }
}
@media (max-width: 760px) {
  header.top .wrap { flex-wrap: wrap; gap: 10px 14px; }
  .logo svg { width: 38px; height: 38px; }
  .search { order: 3; flex: 1 1 100%; width: auto; }
  nav.menu { order: 2; flex: 1; justify-content: flex-end; gap: 0; }
  nav.menu button { padding: 8px; }
  .avatar { display: none; }
  .hero { min-height: 0; margin-top: 0; }
  .hero .wrap { padding-block: 40px 110px; }
  .hero::after { background: linear-gradient(0deg, var(--bg) 0%, rgba(5,7,13,.75) 55%, rgba(5,7,13,.35) 100%); }
  .hero p.tag { font-size: 16px; }
  .hero h1 { font-size: 26px; letter-spacing: .14em; }
  .hero-text { margin-left: 0; }
  .arrow { display: none; }
  .dots { bottom: 84px; }
  .row { grid-auto-columns: 42%; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .dlg { grid-template-columns: 1fr; }
  .dlg .poster { width: 150px; }
}
@media (prefers-reduced-motion: reduce) { .card .poster, .hero-bg, .dots button { transition: none; } }
</style>

function poster(d) {
  const [a, b, glow] = d.c;
  const seed = [...d.id].reduce((n, ch) => n + ch.charCodeAt(0), 0);
  const x = 15 + seed % 55, y = 5 + (seed * 7) % 30, r = 55 + seed % 35;
  const longest = Math.max(...d.title.split(/\s+/).map(w => w.length));
  const fs = Math.round(Math.min(36, 300 / Math.max(longest, 6), d.title.length > 22 ? 22 : 36));
  return `<div class="poster" style="background:linear-gradient(170deg, ${a}, ${b} 80%)">
    <span class="shape" style="left:${x - r/2}%;top:${y}%;width:${r}%;aspect-ratio:1;background:radial-gradient(circle, ${glow} 0%, transparent 68%);opacity:.8"></span>
    <span class="shape" style="left:${(x + 35) % 80}%;top:${y + 25}%;width:${r/2.2}%;aspect-ratio:1;border:1px solid ${glow};opacity:.35"></span>
    <span class="kind">${d.type === "film" ? "Film" : "Série"}</span>${d.free ? '<span class="full">En entier</span>' : ""}
    ${saved.has(d.id) ? `<span class="saved" title="Dans ma liste">${ICON(I.check)}</span>` : ""}
    <div class="ptitle" style="font-size:${fs}px;color:${glow}">${esc(d.title)}</div>
  </div>`;
}
const card = d => `<button class="card" data-open="${d.id}" aria-label="${esc(d.title)}">${poster(d)}<span class="sub">${years(d)} · ${d.len}</span></button>`;

/* Hero background: star field + glowing ring, in each title's colors */
function drawHero(d) {
  const cv = $("#hero-canvas"), box = cv.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, box.width * dpr); cv.height = Math.max(1, box.height * dpr);
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);
  const W = box.width, H = box.height, [a, b, glow] = d.c;
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, b); g.addColorStop(.6, a); g.addColorStop(1, b);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  let s = [...d.id].reduce((n, ch) => n * 31 + ch.charCodeAt(0), 7) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 0; i < 260; i++) { ctx.fillStyle = `rgba(255,255,255,${rnd() * .7})`; ctx.beginPath(); ctx.arc(rnd() * W, rnd() * H, rnd() * 1.3, 0, 7); ctx.fill(); }
  const cx = W * (W < 760 ? .7 : .72), cy = H * .38, R = Math.min(W, H) * .32;
  const halo = ctx.createRadialGradient(cx, cy, R * .3, cx, cy, R * 1.9);
  halo.addColorStop(0, glow + "66"); halo.addColorStop(1, "transparent");
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-.25);
  for (let k = 0; k < 6; k++) { ctx.strokeStyle = glow; ctx.globalAlpha = .12 + k * .05; ctx.lineWidth = 14 - k * 2; ctx.shadowColor = glow; ctx.shadowBlur = 30; ctx.beginPath(); ctx.ellipse(0, 0, R * 1.45, R * .38, 0, 0, 7); ctx.stroke(); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 40; ctx.shadowColor = glow; ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(0, 0, R * .62, 0, 7); ctx.fill();
  ctx.shadowBlur = 0; ctx.strokeStyle = glow; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, R * .64, 0, 7); ctx.stroke();
  ctx.restore();
  ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.beginPath(); ctx.moveTo(0, H); ctx.quadraticCurveTo(W * .5, H * .78, W, H * .86); ctx.lineTo(W, H); ctx.fill();
}

function renderHero() {

    <h1>${esc(d.title)}</h1>
    <p class="tag">${esc(d.tag || d.syn)}</p>
    <div class="facts">
      <span>${ICON(I.cal)}${years(d)}</span><i class="sep"></i>

      <span>${ICON(I.tag)}${d.genres[0]}</span>${d.free ? `<i class="sep"></i><span>${ICON(I.play)}Gratuit, en entier</span>` : ""}

function renderGenreBar() {
  $("#genre-bar").innerHTML = GENRES.map(([g, p], i) => {
    const on = i === 0 ? state.genre === null : state.genre === g;
    return `<button data-genre="${i === 0 ? "" : esc(g)}" aria-pressed="${on}">${ICON(p, "")}<span>${esc(g)}</span></button>`;
  }).join("");
}

function section(title, list, more) {
  return `<section><div class="row-head"><h2>${title}</h2>${more ? `<button class="more" data-view="${more}">Voir plus ${ICON(I.arrow)}</button>` : ""}</div>
    ${list.length ? `<div class="row">${list.map(card).join("")}</div>` : `<div class="empty">Aucun titre dans ce genre pour l'instant.</div>`}</section>`;
}

function renderMain() {
  const q = norm(state.q.trim());
  const g = state.genre;
  const inGenre = d => !g || d.genres.includes(g);
  $("#home").hidden = !(state.view === "accueil" && !q);
  let html = "";
  if (q) {
    const list = DATA.filter(d => norm([d.title, d.by, ...d.genres].join(" ")).includes(q));
    html = `<section><div class="row-head"><h2>Résultats pour « ${esc(state.q.trim())} »</h2></div>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Aucun titre ne correspond. Essaie un autre mot.</div>`}</section>`;
  } else if (state.view === "accueil") {
    const films = DATA.filter(d => d.type === "film" && inGenre(d));
    const series = DATA.filter(d => d.type === "serie" && inGenre(d));
    html = (g ? `<div class="row-head"><h2>${esc(g)}</h2></div>` : "") +
      section("Films complets à regarder", DATA.filter(d => d.free && d.type === "film" && !d.genres.includes("Animation") && inGenre(d)), "films") +
      section("Animation libre", DATA.filter(d => d.free && d.type === "film" && d.genres.includes("Animation") && inGenre(d)), null) +
      section("Séries classiques", DATA.filter(d => d.free && d.type === "serie" && inGenre(d)), "series") +
      section("Grands films · bandes-annonces", films.filter(d => !d.free), "films") +
      section("Grandes séries · bandes-annonces", series.filter(d => !d.free), "series");
  } else if (state.view === "a-propos") {
    html = `<section class="about"><h2>À propos</h2>
      <p>Salle Obscure réunit des films et des séries que l'on peut regarder en entier gratuitement et légalement, et un catalogue de grands titres avec leur bande-annonce officielle.</p>
      <p>Les titres marqués « En entier » sont soit dans le domaine public aux États-Unis (films anciens publiés sans renouvellement de droits), soit sous licence Creative Commons BY, comme les films d'animation de la Blender Foundation. Les vidéos sont hébergées par <a href="https://archive.org" target="_blank" rel="noopener">Internet Archive</a>. La source et la licence sont indiquées sur chaque fiche.</p>
      <p>Tu peux aussi y regarder tes propres vidéos depuis la fiche d'un titre.</p></section>`;
  } else {
    const list = DATA.filter(d => state.view === "films" ? d.type === "film" : state.view === "series" ? d.type === "serie" : saved.has(d.id));
    const title = { films: "Tous les films", series: "Toutes les séries", "ma-liste": "Ma liste" }[state.view];
    html = `<section><div class="row-head"><h2>${title}</h2><span class="sub" style="color:var(--muted)">${list.length} titre${list.length > 1 ? "s" : ""}</span></div>
      ${list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty">Ta liste est vide. Ouvre une fiche et clique sur « Ajouter à ma liste ».</div>`}</section>`;
  }
  $("#main").innerHTML = html;
  document.querySelectorAll("nav.menu button").forEach(b => b.toggleAttribute("aria-current", b.dataset.view === state.view && !q));
  document.querySelectorAll("nav.menu button[aria-current]").forEach(b => b.setAttribute("aria-current", "page"));
}

      <span>Aucune vidéo pour ce titre. Glisse un fichier ici ou choisis-le.</span>
      <label class="btn primary" for="file-${d.id}">${ICON(I.play)}Choisir une vidéo<input id="file-${d.id}" type="file" accept="video/*" data-file="${d.id}"></label>
      <small>Uniquement des vidéos dont tu as les droits : tes propres vidéos ou des contenus libres de droits. MP4 conseillé.</small>
    </div>`;
}
function openDetail(id) {
  const d = byId(id), dlg = $("#dlg");
  dlg.innerHTML = `<button class="close" id="dlg-close" aria-label="Fermer">${ICON(I.x)}</button>
    <div class="dlg">${poster(d)}
      <div>
        <span class="badge"><span class="dot">${ICON(I.star)}</span>${d.type === "film" ? "Film" : "Série"}</span>
        <h2 id="dlg-title">${esc(d.title)}</h2>
        <p>${esc(d.syn)}</p>
        <dl>
          <dt>${d.type === "film" ? "Sortie" : "Diffusion"}</dt><dd>${years(d)}</dd>
          <dt>${d.type === "film" ? "Durée" : "Format"}</dt><dd>${d.len}</dd>
          <dt>${d.type === "film" ? "Réalisation" : "Création"}</dt><dd>${esc(d.by)}</dd>
          <dt>Âge conseillé</dt><dd>${esc(d.age)}</dd>
          <dt>Genres</dt><dd>${d.genres.join(", ")}</dd>
          ${d.free ? `<dt>Licence</dt><dd><a href="${d.free.licUrl}" target="_blank" rel="noopener" style="color:var(--accent-2)">${d.free.lic}</a></dd>
          <dt>Source</dt><dd><a href="${d.free.page}" target="_blank" rel="noopener" style="color:var(--accent-2)">${d.free.src}</a>${d.free.credit ? ` · ${esc(d.free.credit)}` : ""}</dd>` : ""}
        </dl>
        <div class="actions">
          ${d.free ? `<button class="btn primary" data-play="${d.id}">${ICON(I.play)}Regarder en entier</button>` : `<a class="btn primary" href="${trailer(d)}" target="_blank" rel="noopener">${ICON(I.play)}Bande-annonce</a>`}
          <button class="btn" id="dlg-save" data-save="${d.id}">${ICON(saved.has(d.id) ? I.check : I.plus)}${saved.has(d.id) ? "Dans ma liste" : "Ma liste"}</button>
        </div>
      </div></div>
    <div class="player" id="player">${playerHTML(d)}</div>`;
  bindDrop(d.id); bindVideo();
  if (!dlg.open) dlg.showModal();
}
function bindVideo() {
  const v = $("#vid"), fb = $("#vid-fallback"); if (!v || !fb) return;
  v.addEventListener("error", () => { v.hidden = true; fb.hidden = false; });
}
function playNow() {
  const v = $("#vid"); if (!v) return;
  v.scrollIntoView({ behavior: "smooth", block: "center" });
  v.play().catch(() => {});
}
function setVideo(id, file) {
  if (!file || !file.type.startsWith("video/")) return;
  if (VIDEOS[id]) URL.revokeObjectURL(VIDEOS[id].url);
  VIDEOS[id] = { url: URL.createObjectURL(file), name: file.name };
  $("#player").innerHTML = playerHTML(byId(id));
  const v = $("#vid"); if (v) v.play().catch(() => {});
}
function bindDrop(id) {
  const z = $("#drop"); if (!z) return;
  z.addEventListener("dragover", e => { e.preventDefault(); z.classList.add("over"); });
  z.addEventListener("dragleave", () => z.classList.remove("over"));
  z.addEventListener("drop", e => { e.preventDefault(); z.classList.remove("over"); setVideo(id, e.dataTransfer.files[0]); });
}

/* Events */
function go(view) {
  state.view = view; state.q = ""; $("#q").value = "";
  try { history.replaceState(null, "", "#" + view); } catch (e) {}
  renderMain(); window.scrollTo({ top: 0 });
}
function setHero(i) { state.hero = (i + FEATURED.length) % FEATURED.length; renderHero(); }
let timer = setInterval(() => setHero(state.hero + 1), 8000);
const resetTimer = () => { clearInterval(timer); timer = setInterval(() => setHero(state.hero + 1), 8000); };

document.addEventListener("click", e => {
  const t = e.target.closest("[data-play],[data-open],[data-save],[data-view],[data-genre],[data-dot],[data-remove],#dlg-close,#prev,#next");
  if (!t) { if (e.target === $("#dlg")) $("#dlg").close(); return; }
  if (t.id === "dlg-close") return $("#dlg").close();
  if (t.id === "prev" || t.id === "next") { setHero(state.hero + (t.id === "next" ? 1 : -1)); return resetTimer(); }
  if (t.dataset.dot) { setHero(+t.dataset.dot); return resetTimer(); }
  if (t.dataset.remove) { const id = t.dataset.remove; URL.revokeObjectURL(VIDEOS[id].url); delete VIDEOS[id]; $("#player").innerHTML = playerHTML(byId(id)); return bindDrop(id); }
  if (t.dataset.save) {
    const id = t.dataset.save; saved.has(id) ? saved.delete(id) : saved.add(id); persist();
    renderHero(); renderMain(); if ($("#dlg").open) openDetail(id); return;
  }
  if (t.dataset.play) return playNow();
  if (t.dataset.open) { openDetail(t.dataset.open); if (t.dataset.autoplay && byId(t.dataset.open).free) playNow(); return; }
  if (t.dataset.view) return go(t.dataset.view);
  if ("genre" in t.dataset) {
    state.genre = t.dataset.genre || null; renderGenreBar(); renderMain();
    $("#main").scrollIntoView({ behavior: "smooth", block: "start" });
  }
});
document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.file) setVideo(e.target.dataset.file, e.target.files[0]); });
$("#dlg").addEventListener("close", () => { const v = $("#vid"); if (v) v.pause(); });
$("#q").addEventListener("input", e => { state.q = e.target.value; renderMain(); });
$(".logo").addEventListener("click", e => { e.preventDefault(); go("accueil"); });
window.addEventListener("resize", () => drawHero(byId(FEATURED[state.hero])));
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (["accueil","films","series","ma-liste","a-propos"].includes(v) && v !== state.view) go(v); });

const start = location.hash.slice(1);
if (["films","series","ma-liste","a-propos"].includes(start)) state.view = start;
renderHero(); renderGenreBar(); renderMain();
</script>

</body>
</html>
